[Date]
date.timezone = "Asia/Tokyo"
[mbstring]
default_charset = "UTF-8"
mbstring.language = "Japanese"

xdebug.mode=debug
; 毎回つなぎに行くと、IDE が待ち受けていないときにリクエストが遅くなりログも増える。
; トリガー（XDEBUG_SESSION の Cookie やクエリ、CLI では XDEBUG_TRIGGER=1）があるときだけつなぐ
xdebug.start_with_request=trigger
xdebug.client_host="host.docker.internal"
xdebug.client_port=9003
xdebug.log=/tmp/xdebug.log
; 既定の 7 だと、つながないリクエストでも毎回ログを書く。接続の失敗などのエラーだけを残す
xdebug.log_level=1
